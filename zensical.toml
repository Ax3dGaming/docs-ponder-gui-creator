[project]
site_url = "https://www.youtube.com/"
site_name = "Ponder GUI Builder Documentation"
site_description = "Ponder GUI Builder Documentation"
site_author = "Ax3dgaming"

copyright = "Copyright &copy; 2026 Ax3dgaming"

# repo_url = "https://github.com/user/repo"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Global Settings" = "gui-creator/global-settings.md" },
  { "GUI Creator" = [
    { "Components" = [
      { "Button" = "gui-creator/components/button.md"},
      { "Image Button" = "gui-creator/components/image-button.md"},
      { "Image" = "gui-creator/components/image.md"},
      { "Dropdown menu" = "gui-creator/components/dropdown.md"},
      { "Edit Box" = "gui-creator/components/edit-box.md"},
      { "Progress Bar" = "gui-creator/components/progress-bar.md"},
      { "Slider" = "gui-creator/components/slider.md"},
      { "Switch" = "gui-creator/components/switch.md"},
      { "Label" = "gui-creator/components/label.md"},
      { "Entity Display" = "gui-creator/components/entity-display.md"},
      { "Player Display" = "gui-creator/components/player-display.md"},
      { "Item Display" = "gui-creator/components/item-display.md"},
      { "Player Inventory" = "gui-creator/components/player-inventory.md"},
      { "Slots" = "gui-creator/components/slots.md"},
      { "Group" = "gui-creator/components/group.md"},
      { "Hover Area" = "gui-creator/components/hover-area.md"},
      { "Scroll Panel" = "gui-creator/components/scroll-panel.md"}
    ]}
  ]}
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
